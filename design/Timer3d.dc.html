<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Đồng hồ hành động 3D</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
@keyframes tDrop{0%{transform:translateY(0) scale(0.2);opacity:0}10%{opacity:1}35%{transform:translateY(0) scale(1)}51.25%{transform:translateY(6px) scale(1)}67.5%{transform:translateY(24px) scale(1)}83.75%{transform:translateY(54px) scale(1)}100%{transform:translateY(96px) scale(1);opacity:1}}
@keyframes tRipple{0%{transform:scale(0.3);opacity:0.9}40%{transform:scale(1.7);opacity:0}100%{transform:scale(1.7);opacity:0}}
@keyframes tSteam{0%{transform:translate(0,8px) scaleY(0.8);opacity:0}25%{opacity:0.85}100%{transform:translate(4px,-30px) scaleY(1.15);opacity:0}}
@keyframes tBubble{0%{transform:scale(0);opacity:0}55%{transform:scale(1);opacity:1}68%{transform:scale(1.12);opacity:1}72%{transform:scale(1.45);opacity:0}100%{transform:scale(1.45);opacity:0}}
@keyframes tFlame{0%,100%{transform:scale(1,1)}25%{transform:scale(0.94,1.08)}50%{transform:scale(1.04,0.9)}75%{transform:scale(0.97,1.04)}}
@keyframes tSlide{0%{transform:translateY(0);opacity:0}15%{transform:translateY(2px);opacity:1}72%{transform:translateY(78px);opacity:1}78%{transform:translateY(80px);opacity:1}100%{transform:translateY(94px);opacity:0}}
@keyframes tBob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(2px) rotate(1.5deg)}}
@keyframes tWave{0%,100%{transform:translateX(0)}50%{transform:translateX(-4px)}}
@keyframes tGlow{0%,100%{opacity:0.72}50%{opacity:0.82}}
@keyframes tGrain{0%,100%{transform:translate(0,0)}50%{transform:translate(3px,1px)}}
@keyframes tSand{0%{stroke-dashoffset:0}100%{stroke-dashoffset:-14}}
@media (prefers-reduced-motion: reduce){.t-anim{animation:none !important}}
</style>
</helmet>
<div aria-hidden="true" style="width: {{rootW}}; display: flex; flex-wrap: wrap; gap: {{gap}}; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; color: #4A3F3A">

<sc-if value="{{showPump}}" hint-placeholder-val="{{ true }}">
<div style="width: {{px}}; display: flex; flex-direction: column; align-items: center; gap: 6px">
<svg width="{{px}}" height="{{px}}" viewBox="0 0 200 200">
<defs>
<radialGradient id="tp_sh" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#8E4A3F" stop-opacity="0.3"></stop><stop offset="1" stop-color="#8E4A3F" stop-opacity="0"></stop></radialGradient>
<linearGradient id="tp_fun" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#DDE6EE"></stop><stop offset="0.35" stop-color="#F7FAFC"></stop><stop offset="1" stop-color="#BCCAD6"></stop></linearGradient>
<linearGradient id="tp_col" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#D3DEE8"></stop><stop offset="0.35" stop-color="#F4F8FB"></stop><stop offset="1" stop-color="#A9BBCB"></stop></linearGradient>
<linearGradient id="tp_glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E7EEF4"></stop><stop offset="0.3" stop-color="#FFFFFF"></stop><stop offset="1" stop-color="#C3D3E0"></stop></linearGradient>
<linearGradient id="tp_milk" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FAF2E4"></stop><stop offset="0.35" stop-color="#FFFFFF"></stop><stop offset="1" stop-color="#E6D6BD"></stop></linearGradient>
<radialGradient id="tp_drop" cx="38%" cy="40%" r="70%"><stop offset="0" stop-color="#FFFFFF"></stop><stop offset="1" stop-color="#EBD9C9"></stop></radialGradient>
<clipPath id="tp_clip"><rect x="70" y="84" width="60" height="94" rx="18"></rect></clipPath>
<clipPath id="tp_air"><rect x="66" y="76" width="68" height="{{airH}}"></rect></clipPath>
</defs>
<ellipse cx="100" cy="188" rx="50" ry="7" fill="url(#tp_sh)"></ellipse>
<path d="M70 30 H130 C130 35 125 38 118 40 L109 47 V54 H91 V47 L82 40 C75 38 70 35 70 30Z" fill="url(#tp_fun)" opacity="0.85"></path>
<path d="M77 32 C80 35 84 37 88 38" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.7"></path>
<rect x="89" y="52" width="22" height="14" rx="4" fill="url(#tp_col)"></rect>
<rect x="80" y="64" width="40" height="16" rx="5" fill="url(#tp_col)"></rect>
<rect x="66" y="76" width="68" height="106" rx="24" fill="url(#tp_glass)"></rect>
<g clip-path="url(#tp_clip)">
<rect x="66" y="{{milkTop}}" width="68" height="120" fill="url(#tp_milk)"></rect>
<ellipse cx="100" cy="{{milkTop}}" rx="30" ry="4" fill="#FFFFFF"></ellipse>
</g>
<g clip-path="url(#tp_air)">
<path class="t-anim" d="M100 80 C104 86 106 89 106 92 A6 6 0 0 1 94 92 C94 89 96 86 100 80Z" fill="url(#tp_drop)" stroke="#E2C9B6" stroke-width="0.8" style="transform-box: fill-box; transform-origin: 50% 0%; animation: tDrop 1s linear infinite; animation-play-state: {{play}}"></path>
</g>
<ellipse class="t-anim" cx="100" cy="{{milkTop}}" rx="14" ry="3" fill="none" stroke="#DDBFAF" stroke-width="2" opacity="0" style="transform-box: fill-box; transform-origin: center; animation: tRipple 1s ease-out {{rippleDelay}} infinite; animation-play-state: {{play}}"></ellipse>
<path d="M120 100h7M122 116h5M120 132h7M122 148h5" stroke="#9DB6CC" stroke-width="2" stroke-linecap="round"></path>
<rect x="73" y="88" width="7" height="80" rx="3.5" fill="#FFFFFF" opacity="0.85"></rect>
</svg>
<sc-if value="{{all}}" hint-placeholder-val="{{ false }}"><span style="font-size: 15px; font-weight: 500">Hút sữa</span></sc-if>
</div>
</sc-if>

<sc-if value="{{showMilk}}" hint-placeholder-val="{{ false }}">
<div style="width: {{px}}; display: flex; flex-direction: column; align-items: center; gap: 6px">
<svg width="{{px}}" height="{{px}}" viewBox="0 0 200 200">
<defs>
<radialGradient id="tm_sh" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#2F4A63" stop-opacity="0.3"></stop><stop offset="1" stop-color="#2F4A63" stop-opacity="0"></stop></radialGradient>
<linearGradient id="tm_nip" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F9E9CF"></stop><stop offset="0.4" stop-color="#FFF6E6"></stop><stop offset="1" stop-color="#DDBF92"></stop></linearGradient>
<linearGradient id="tm_cap" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A9C6E4"></stop><stop offset="0.35" stop-color="#D3E4F4"></stop><stop offset="1" stop-color="#4F7AA5"></stop></linearGradient>
<linearGradient id="tm_glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E4EEF7"></stop><stop offset="0.3" stop-color="#FFFFFF"></stop><stop offset="1" stop-color="#B8CFE3"></stop></linearGradient>
<linearGradient id="tm_milk" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FBF5EA"></stop><stop offset="0.35" stop-color="#FFFFFF"></stop><stop offset="1" stop-color="#E5D6BE"></stop></linearGradient>
<linearGradient id="tm_frozen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"></stop><stop offset="0.5" stop-color="#EAF2F9"></stop><stop offset="1" stop-color="#BCD5EA"></stop></linearGradient>
<linearGradient id="tm_bowl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E9F1F7"></stop><stop offset="0.35" stop-color="#FFFFFF"></stop><stop offset="1" stop-color="#AFC7DB"></stop></linearGradient>
<linearGradient id="tm_water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E3F0FA"></stop><stop offset="1" stop-color="#A9CBE7"></stop></linearGradient>
<clipPath id="tm_in"><rect x="77" y="50" width="46" height="110" rx="14"></rect></clipPath>
</defs>
<ellipse cx="100" cy="190" rx="74" ry="7" fill="url(#tm_sh)"></ellipse>
<ellipse cx="100" cy="132" rx="74" ry="14" fill="#DCE7F0"></ellipse>
<ellipse cx="100" cy="134" rx="68" ry="10" fill="url(#tm_water)"></ellipse>
<path class="t-anim" d="M48 126 q-5 -8 0 -16 t0 -16" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0" style="transform-box: fill-box; animation: tSteam 2.6s ease-out infinite; animation-play-state: {{play}}"></path>
<path class="t-anim" d="M154 126 q-5 -8 0 -16 t0 -16" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0" style="transform-box: fill-box; animation: tSteam 2.6s ease-out 1.3s infinite; animation-play-state: {{play}}"></path>
<path d="M92 32 C92 20 95 14 100 14 C105 14 108 20 108 32Z" fill="url(#tm_nip)"></path>
<rect x="80" y="30" width="40" height="16" rx="6" fill="url(#tm_cap)"></rect>
<rect x="74" y="44" width="52" height="118" rx="18" fill="url(#tm_glass)"></rect>
<g clip-path="url(#tm_in)">
<rect x="74" y="{{liquidTop}}" width="52" height="120" fill="url(#tm_milk)"></rect>
<ellipse cx="100" cy="{{liquidTop}}" rx="22" ry="2.5" fill="#FFFFFF"></ellipse>
<sc-if value="{{showFrozen}}" hint-placeholder-val="{{ true }}">
<g class="t-anim" style="transform-box: fill-box; transform-origin: 50% 80%; animation: {{bobAnim}}; animation-play-state: {{play}}">
<rect x="{{frozenX}}" y="{{frozenY}}" width="{{frozenW}}" height="{{frozenH}}" rx="{{frozenR}}" fill="url(#tm_frozen)" stroke="#C9DCEC" stroke-width="1.2"></rect>
<rect x="{{frozenHiX}}" y="{{frozenHiY}}" width="5" height="{{frozenHiH}}" rx="2.5" fill="#FFFFFF" opacity="0.9"></rect>
</g>
</sc-if>
</g>
<rect x="74" y="44" width="52" height="118" rx="18" fill="#FFFFFF" opacity="{{frostOp}}"></rect>
<g opacity="{{frostOp}}" stroke="#B7D2EA" stroke-width="2" stroke-linecap="round"><path d="M88 60v10M83 65h10M112 96v8M108 100h8M90 118v8M86 122h8"></path></g>
<rect x="79" y="50" width="6" height="96" rx="3" fill="#FFFFFF" opacity="0.85"></rect>
<path d="M32 134 A68 10 0 0 0 168 134 L168 140 A68 10 0 0 1 32 140Z" fill="#B9D6EE" opacity="0.5"></path>
<path class="t-anim" d="M50 138 q8 -3 16 0 t16 0 M118 139 q8 -3 16 0 t16 0" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.8" style="animation: tWave 3s ease-in-out infinite; animation-play-state: {{play}}"></path>
<path d="M26 132 A74 14 0 0 0 174 132 C174 168 140 184 100 184 C60 184 26 168 26 132Z" fill="url(#tm_bowl)"></path>
<path d="M38 152 C46 166 64 175 82 178" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.8"></path>
</svg>
<sc-if value="{{all}}" hint-placeholder-val="{{ false }}"><span style="font-size: 15px; font-weight: 500">Rã đông sữa</span></sc-if>
</div>
</sc-if>

<sc-if value="{{showFood}}" hint-placeholder-val="{{ false }}">
<div style="width: {{px}}; display: flex; flex-direction: column; align-items: center; gap: 6px">
<svg width="{{px}}" height="{{px}}" viewBox="0 0 200 200">
<defs>
<radialGradient id="tf_sh" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#3E3160" stop-opacity="0.3"></stop><stop offset="1" stop-color="#3E3160" stop-opacity="0"></stop></radialGradient>
<linearGradient id="tf_box" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E7DFF6"></stop><stop offset="0.6" stop-color="#C5B7E4"></stop><stop offset="1" stop-color="#9381C2"></stop></linearGradient>
<linearGradient id="tf_lid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBF9FF"></stop><stop offset="1" stop-color="#C9BCE6"></stop></linearGradient>
<radialGradient id="tf_food" cx="40%" cy="35%" r="75%"><stop offset="0" stop-color="#FBE3D2"></stop><stop offset="1" stop-color="#E5A98A"></stop></radialGradient>
<radialGradient id="tf_drop" cx="38%" cy="35%" r="70%"><stop offset="0" stop-color="#FFFFFF"></stop><stop offset="1" stop-color="#A9CCEA"></stop></radialGradient>
</defs>
<ellipse cx="100" cy="186" rx="84" ry="7" fill="url(#tf_sh)"></ellipse>
<ellipse cx="100" cy="181" rx="{{puddleRx}}" ry="{{puddleRy}}" fill="#BFD8EE" opacity="0.75"></ellipse>
<ellipse cx="88" cy="180" rx="{{puddleHi}}" ry="1.6" fill="#FFFFFF" opacity="0.8"></ellipse>
<rect x="26" y="82" width="148" height="92" rx="24" fill="url(#tf_box)"></rect>
<rect x="38" y="96" width="124" height="64" rx="16" fill="url(#tf_food)" opacity="0.9"></rect>
<g fill="#F7C7AE"><ellipse cx="62" cy="120" rx="12" ry="8"></ellipse><ellipse cx="100" cy="134" rx="14" ry="9"></ellipse><ellipse cx="138" cy="118" rx="11" ry="8"></ellipse></g>
<g fill="#9BBE73"><circle cx="82" cy="112" r="4"></circle><circle cx="120" cy="140" r="4"></circle><circle cx="146" cy="138" r="3.5"></circle></g>
<rect x="26" y="82" width="148" height="92" rx="24" fill="#FFFFFF" opacity="{{frostOp}}"></rect>
<rect x="18" y="62" width="164" height="26" rx="13" fill="url(#tf_lid)"></rect>
<path d="M22 70 Q40 58 60 66 T100 64 T140 66 T178 70 V74 H22Z" fill="#FFFFFF" opacity="{{frostOp}}"></path>
<rect x="80" y="50" width="40" height="14" rx="7" fill="#B7A6DC"></rect>
<rect x="28" y="66" width="60" height="5" rx="2.5" fill="#FFFFFF" opacity="0.9"></rect>
<g opacity="{{frostOp}}" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"><path d="M48 104v12M42 110h12M152 150v10M147 155h10M150 98v8M146 102h8"></path></g>
<sc-if value="{{dripA}}" hint-placeholder-val="{{ true }}">
<path class="t-anim" d="M30 90 C32 94 34 96 34 98 A4 4 0 0 1 26 98 C26 96 28 94 30 90Z" fill="url(#tf_drop)" opacity="0" style="animation: tSlide 3.2s ease-in-out infinite; animation-play-state: {{play}}"></path>
<path class="t-anim" d="M170 90 C172 94 174 96 174 98 A4 4 0 0 1 166 98 C166 96 168 94 170 90Z" fill="url(#tf_drop)" opacity="0" style="animation: tSlide 3.2s ease-in-out 1.6s infinite; animation-play-state: {{play}}"></path>
</sc-if>
<sc-if value="{{dripB}}" hint-placeholder-val="{{ false }}">
<path class="t-anim" d="M62 90 C64 94 66 96 66 98 A4 4 0 0 1 58 98 C58 96 60 94 62 90Z" fill="url(#tf_drop)" opacity="0" style="animation: tSlide 2.6s ease-in-out 0.8s infinite; animation-play-state: {{play}}"></path>
<path class="t-anim" d="M140 90 C142 94 144 96 144 98 A4 4 0 0 1 136 98 C136 96 138 94 140 90Z" fill="url(#tf_drop)" opacity="0" style="animation: tSlide 2.6s ease-in-out 2.1s infinite; animation-play-state: {{play}}"></path>
</sc-if>
</svg>
<sc-if value="{{all}}" hint-placeholder-val="{{ false }}"><span style="font-size: 15px; font-weight: 500">Rã đông đồ ăn</span></sc-if>
</div>
</sc-if>

<sc-if value="{{showChao}}" hint-placeholder-val="{{ false }}">
<div style="width: {{px}}; display: flex; flex-direction: column; align-items: center; gap: 6px">
<svg width="{{px}}" height="{{px}}" viewBox="0 0 200 200">
<defs>
<radialGradient id="tc_sh" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#5E4715" stop-opacity="0.3"></stop><stop offset="1" stop-color="#5E4715" stop-opacity="0"></stop></radialGradient>
<linearGradient id="tc_pot" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#EFC57E"></stop><stop offset="0.3" stop-color="#FFF1D2"></stop><stop offset="1" stop-color="#C08E35"></stop></linearGradient>
<radialGradient id="tc_por" cx="45%" cy="40%" r="65%"><stop offset="0" stop-color="#FFFFFF"></stop><stop offset="1" stop-color="#EBDDBD"></stop></radialGradient>
<radialGradient id="tc_wat" cx="45%" cy="40%" r="65%"><stop offset="0" stop-color="#F4F9FC"></stop><stop offset="1" stop-color="#C9DDE9"></stop></radialGradient>
<linearGradient id="tc_flame" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#F08A4B"></stop><stop offset="0.6" stop-color="#F7B267"></stop><stop offset="1" stop-color="#FFE3A3"></stop></linearGradient>
<linearGradient id="tc_hdl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E2B36A"></stop><stop offset="1" stop-color="#A9792A"></stop></linearGradient>
</defs>
<ellipse cx="100" cy="190" rx="66" ry="6" fill="url(#tc_sh)"></ellipse>
<ellipse cx="100" cy="182" rx="56" ry="7" fill="#D9CCC3"></ellipse>
<sc-if value="{{showFlame}}" hint-placeholder-val="{{ true }}">
<path class="t-anim" d="M76 182 C70 172 76 164 80 158 C82 166 88 170 86 182Z" fill="url(#tc_flame)" style="transform-box: fill-box; transform-origin: 50% 100%; animation: tFlame 0.7s ease-in-out infinite; animation-play-state: {{play}}"></path>
<path class="t-anim" d="M96 182 C88 170 96 160 100 152 C104 160 112 170 104 182Z" fill="url(#tc_flame)" style="transform-box: fill-box; transform-origin: 50% 100%; animation: tFlame 0.55s ease-in-out 0.2s infinite; animation-play-state: {{play}}"></path>
<path class="t-anim" d="M114 182 C112 170 118 166 120 158 C124 164 130 172 124 182Z" fill="url(#tc_flame)" style="transform-box: fill-box; transform-origin: 50% 100%; animation: tFlame 0.8s ease-in-out 0.1s infinite; animation-play-state: {{play}}"></path>
</sc-if>
<rect x="16" y="100" width="22" height="12" rx="6" fill="url(#tc_hdl)"></rect>
<rect x="162" y="100" width="22" height="12" rx="6" fill="url(#tc_hdl)"></rect>
<path d="M34 92 H166 V140 C166 160 150 172 130 172 H70 C50 172 34 160 34 140Z" fill="url(#tc_pot)"></path>
<path d="M44 106 C44 130 48 150 60 162" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.6"></path>
<ellipse cx="100" cy="92" rx="66" ry="12" fill="#FFF6E2"></ellipse>
<sc-if value="{{isSoak}}" hint-placeholder-val="{{ false }}">
<ellipse cx="100" cy="94" rx="58" ry="9" fill="url(#tc_wat)"></ellipse>
<g class="t-anim" fill="#FFFFFF" stroke="#DCCFB6" stroke-width="0.6" style="animation: tGrain 4s ease-in-out infinite; animation-play-state: {{play}}">
<ellipse cx="70" cy="95" rx="3.2" ry="1.4" transform="rotate(-20 70 95)"></ellipse>
<ellipse cx="84" cy="92" rx="3.2" ry="1.4" transform="rotate(15 84 92)"></ellipse>
<ellipse cx="98" cy="97" rx="3.2" ry="1.4" transform="rotate(-8 98 97)"></ellipse>
<ellipse cx="112" cy="93" rx="3.2" ry="1.4" transform="rotate(25 112 93)"></ellipse>
<ellipse cx="126" cy="96" rx="3.2" ry="1.4" transform="rotate(-30 126 96)"></ellipse>
<ellipse cx="92" cy="90" rx="3.2" ry="1.4" transform="rotate(5 92 90)"></ellipse>
</g>
</sc-if>
<sc-if value="{{notSoak}}" hint-placeholder-val="{{ true }}">
<ellipse cx="100" cy="94" rx="58" ry="9" fill="url(#tc_por)"></ellipse>
<g fill="#9BBE73"><ellipse cx="72" cy="94" rx="3" ry="1.6"></ellipse><ellipse cx="128" cy="92" rx="2.6" ry="1.5"></ellipse></g>
</sc-if>
<sc-if value="{{showBubbles}}" hint-placeholder-val="{{ true }}">
<circle class="t-anim" cx="82" cy="94" r="5" fill="#FFFFFF" stroke="#E6D6B4" stroke-width="1.2" opacity="0" style="transform-box: fill-box; transform-origin: center; animation: tBubble 1.5s ease-out infinite; animation-play-state: {{play}}"></circle>
<circle class="t-anim" cx="106" cy="92" r="4" fill="#FFFFFF" stroke="#E6D6B4" stroke-width="1.2" opacity="0" style="transform-box: fill-box; transform-origin: center; animation: tBubble 1.3s ease-out 0.45s infinite; animation-play-state: {{play}}"></circle>
<circle class="t-anim" cx="124" cy="96" r="5.5" fill="#FFFFFF" stroke="#E6D6B4" stroke-width="1.2" opacity="0" style="transform-box: fill-box; transform-origin: center; animation: tBubble 1.7s ease-out 0.9s infinite; animation-play-state: {{play}}"></circle>
<circle class="t-anim" cx="94" cy="97" r="3" fill="#FFFFFF" stroke="#E6D6B4" stroke-width="1.2" opacity="0" style="transform-box: fill-box; transform-origin: center; animation: tBubble 1.2s ease-out 1.1s infinite; animation-play-state: {{play}}"></circle>
</sc-if>
<sc-if value="{{showSteam}}" hint-placeholder-val="{{ true }}">
<g opacity="{{steamOp}}">
<path class="t-anim" d="M78 76 q-6 -9 0 -18 t0 -18" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0" style="transform-box: fill-box; animation: tSteam {{steamDur}} ease-out infinite; animation-play-state: {{play}}"></path>
<path class="t-anim" d="M100 72 q-6 -9 0 -18 t0 -18" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0" style="transform-box: fill-box; animation: tSteam {{steamDur}} ease-out 0.8s infinite; animation-play-state: {{play}}"></path>
<path class="t-anim" d="M122 76 q-6 -9 0 -18 t0 -18" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0" style="transform-box: fill-box; animation: tSteam {{steamDur}} ease-out 1.6s infinite; animation-play-state: {{play}}"></path>
</g>
</sc-if>
</svg>
<sc-if value="{{all}}" hint-placeholder-val="{{ false }}"><span style="font-size: 15px; font-weight: 500">Nấu cháo</span></sc-if>
</div>
</sc-if>

<sc-if value="{{showBanh}}" hint-placeholder-val="{{ false }}">
<div style="width: {{px}}; display: flex; flex-direction: column; align-items: center; gap: 6px">
<svg width="{{px}}" height="{{px}}" viewBox="0 0 200 200">
<defs>
<radialGradient id="tb_sh" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#6B4A16" stop-opacity="0.3"></stop><stop offset="1" stop-color="#6B4A16" stop-opacity="0"></stop></radialGradient>
<radialGradient id="tb_glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FFC56E" stop-opacity="0.8"></stop><stop offset="1" stop-color="#FFC56E" stop-opacity="0"></stop></radialGradient>
<linearGradient id="tb_tray" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3EEEA"></stop><stop offset="1" stop-color="#B9ACA2"></stop></linearGradient>
<radialGradient id="tb_bake" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="{{bakeIn}}"></stop><stop offset="0.7" stop-color="{{bakeMid}}"></stop><stop offset="1" stop-color="{{bakeOut}}"></stop></radialGradient>
<radialGradient id="tb_shade" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"></stop><stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"></stop><stop offset="1" stop-color="#7A4A16" stop-opacity="0.3"></stop></radialGradient>
</defs>
<g opacity="{{glowOp}}"><ellipse class="t-anim" cx="100" cy="122" rx="96" ry="62" fill="url(#tb_glow)" style="animation: tGlow 4s ease-in-out infinite; animation-play-state: {{play}}"></ellipse></g>
<ellipse cx="100" cy="176" rx="82" ry="7" fill="url(#tb_sh)"></ellipse>
<sc-if value="{{showHeat}}" hint-placeholder-val="{{ true }}">
<g opacity="{{heatOp}}">
<path class="t-anim" d="M66 78 q-5 -8 0 -16 t0 -16" fill="none" stroke="#FFE9D2" stroke-width="3.5" stroke-linecap="round" opacity="0" style="transform-box: fill-box; animation: tSteam 2.6s ease-out infinite; animation-play-state: {{play}}"></path>
<path class="t-anim" d="M100 70 q-5 -8 0 -16 t0 -16" fill="none" stroke="#FFE9D2" stroke-width="3.5" stroke-linecap="round" opacity="0" style="transform-box: fill-box; animation: tSteam 2.6s ease-out 0.9s infinite; animation-play-state: {{play}}"></path>
<path class="t-anim" d="M134 78 q-5 -8 0 -16 t0 -16" fill="none" stroke="#FFE9D2" stroke-width="3.5" stroke-linecap="round" opacity="0" style="transform-box: fill-box; animation: tSteam 2.6s ease-out 1.7s infinite; animation-play-state: {{play}}"></path>
</g>
</sc-if>
<rect x="18" y="140" width="164" height="26" rx="13" fill="url(#tb_tray)"></rect>
<rect x="26" y="144" width="80" height="5" rx="2.5" fill="#FFFFFF" opacity="0.85"></rect>
<g transform="{{puffT}}">
<ellipse cx="56" cy="142" rx="24" ry="4" fill="#8A6A40" opacity="0.25"></ellipse>
<ellipse cx="144" cy="142" rx="24" ry="4" fill="#8A6A40" opacity="0.25"></ellipse>
<circle cx="56" cy="124" r="26" fill="url(#tb_bake)"></circle><circle cx="56" cy="124" r="26" fill="url(#tb_shade)"></circle>
<circle cx="144" cy="124" r="26" fill="url(#tb_bake)"></circle><circle cx="144" cy="124" r="26" fill="url(#tb_shade)"></circle>
<circle cx="100" cy="114" r="30" fill="url(#tb_bake)"></circle><circle cx="100" cy="114" r="30" fill="url(#tb_shade)"></circle>
<g fill="{{biscuitDot}}">
<circle cx="48" cy="118" r="2.4"></circle><circle cx="62" cy="122" r="2.4"></circle><circle cx="54" cy="134" r="2.4"></circle>
<circle cx="136" cy="118" r="2.4"></circle><circle cx="150" cy="122" r="2.4"></circle><circle cx="142" cy="134" r="2.4"></circle>
<circle cx="90" cy="106" r="2.6"></circle><circle cx="108" cy="104" r="2.6"></circle><circle cx="104" cy="120" r="2.6"></circle><circle cx="92" cy="124" r="2.6"></circle>
</g>
</g>
</svg>
<sc-if value="{{all}}" hint-placeholder-val="{{ false }}"><span style="font-size: 15px; font-weight: 500">Bánh ăn dặm</span></sc-if>
</div>
</sc-if>

<sc-if value="{{showOther}}" hint-placeholder-val="{{ false }}">
<div style="width: {{px}}; display: flex; flex-direction: column; align-items: center; gap: 6px">
<svg width="{{px}}" height="{{px}}" viewBox="0 0 200 200">
<defs>
<radialGradient id="tk_sh" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#6B4433" stop-opacity="0.3"></stop><stop offset="1" stop-color="#6B4433" stop-opacity="0"></stop></radialGradient>
<linearGradient id="tk_wood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E7C49A"></stop><stop offset="0.35" stop-color="#F8E2C4"></stop><stop offset="1" stop-color="#A97B4B"></stop></linearGradient>
<linearGradient id="tk_glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"></stop><stop offset="0.3" stop-color="#FFFFFF" stop-opacity="0.9"></stop><stop offset="1" stop-color="#DCE6EE" stop-opacity="0.6"></stop></linearGradient>
<linearGradient id="tk_sand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F0C98A"></stop><stop offset="0.4" stop-color="#FBE2B4"></stop><stop offset="1" stop-color="#D99F5A"></stop></linearGradient>
<clipPath id="tk_top"><path d="M70 34 H130 C130 68 108 86 104 100 H96 C92 86 70 68 70 34Z"></path></clipPath>
<clipPath id="tk_bot"><path d="M96 100 H104 C108 114 130 132 130 166 H70 C70 132 92 114 96 100Z"></path></clipPath>
</defs>
<ellipse cx="100" cy="190" rx="60" ry="6" fill="url(#tk_sh)"></ellipse>
<path d="M70 34 H130 C130 68 108 86 104 100 C108 114 130 132 130 166 H70 C70 132 92 114 96 100 C92 86 70 68 70 34Z" fill="url(#tk_glass)" stroke="#D9CEC6" stroke-width="2"></path>
<sc-if value="{{sandTop}}" hint-placeholder-val="{{ true }}">
<g clip-path="url(#tk_top)"><path d="M60 {{topSandY}} Q100 {{topDipY}} 140 {{topSandY}} V104 H60Z" fill="url(#tk_sand)"></path></g>
</sc-if>
<g clip-path="url(#tk_bot)"><path d="M60 {{botSandY}} Q100 {{botPeakY}} 140 {{botSandY}} V180 H60Z" fill="url(#tk_sand)"></path></g>
<sc-if value="{{sandFlow}}" hint-placeholder-val="{{ true }}">
<line class="t-anim" x1="100" y1="98" x2="100" y2="{{streamEnd}}" stroke="#E7B36C" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="4 3" style="animation: tSand 0.35s linear infinite; animation-play-state: {{play}}"></line>
</sc-if>
<path d="M78 42 C80 60 88 74 94 84" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.9"></path>
<rect x="52" y="20" width="96" height="16" rx="8" fill="url(#tk_wood)"></rect>
<rect x="52" y="164" width="96" height="16" rx="8" fill="url(#tk_wood)"></rect>
<rect x="56" y="34" width="8" height="132" rx="4" fill="url(#tk_wood)"></rect>
<rect x="136" y="34" width="8" height="132" rx="4" fill="url(#tk_wood)"></rect>
</svg>
<sc-if value="{{all}}" hint-placeholder-val="{{ false }}"><span style="font-size: 15px; font-weight: 500">Khác</span></sc-if>
</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["all","pump","milk","food","chao","banh","other"],"default":"all"},"progress":{"editor":"range","min":0,"max":1,"step":0.05,"default":0.55},"phase":{"editor":"enum","options":["cook","soak","cool"],"default":"cook"},"paused":{"editor":"boolean","default":false},"size":{"editor":"int","default":200,"min":80,"max":320},"$preview":{"width":744,"height":500}}'>
class Component extends DCLogic {
  lerp(a, b, t) {
    t = Math.max(0, Math.min(1, t));
    var pa = [1, 3, 5].map(function (i) { return parseInt(a.substr(i, 2), 16); });
    var pb = [1, 3, 5].map(function (i) { return parseInt(b.substr(i, 2), 16); });
    return '#' + pa.map(function (v, i) { var x = Math.round(v + (pb[i] - v) * t); return (x < 16 ? '0' : '') + x.toString(16); }).join('');
  }
  f1(x) { return x.toFixed(1); }
  renderVals() {
    var k = this.props.kind || 'all', all = k === 'all';
    var n = Number(this.props.size) || 200;
    var p = Number(this.props.progress);
    if (!(p >= 0)) p = 0; if (p > 1) p = 1;
    var phase = this.props.phase || 'cook';
    var ease = function (x) { return Math.max(0, Math.min(1, x)); };

    // Hút sữa: drop forms at the valve (y=80, tip at 98) and falls under gravity
    // 96 units over the last 65% of a 1 s cycle; the ripple fires when it reaches the milk.
    var milkTop = 176 - 92 * (0.08 + 0.87 * p);
    var dist = Math.max(0, milkTop - 98);
    var impact = 0.35 + 0.65 * Math.sqrt(Math.min(1, dist / 96));

    // Rã đông sữa: frozen block shrinks and floats as liquid milk rises around it.
    var liquidTop = 158 - (8 + 72 * p);
    var fh = 70 * (1 - p), fw = 38 - 16 * p;
    var fBottom = Math.min(158, liquidTop + fh * 0.18);
    var fTop = fBottom - fh;

    // Bánh: edges brown first, the centre follows; dough puffs early then sets.
    var puff = 0.9 + 0.1 * ease(p * 2.5);

    // Hourglass
    var topY = 40 + 62 * p;
    var botSandY = 166 - 54 * p;
    var botPeakY = botSandY - 14 * ease(p * 3);

    var isSoak = phase === 'soak', isCool = phase === 'cool';
    return {
      all: all, px: n + 'px',
      rootW: all ? (n * 3 + 72) + 'px' : n + 'px',
      gap: all ? '36px' : '0px',
      play: this.props.paused ? 'paused' : 'running',
      showPump: all || k === 'pump', showMilk: all || k === 'milk', showFood: all || k === 'food',
      showChao: all || k === 'chao', showBanh: all || k === 'banh', showOther: all || k === 'other',

      milkTop: this.f1(milkTop), airH: this.f1(Math.max(0, milkTop - 76)),
      rippleDelay: impact.toFixed(2) + 's',

      liquidTop: this.f1(liquidTop),
      showFrozen: p < 0.96,
      frozenX: this.f1(100 - fw / 2), frozenY: this.f1(fTop), frozenW: this.f1(fw), frozenH: this.f1(Math.max(2, fh)),
      frozenR: this.f1(Math.min(10, 4 + fh / 10)),
      frozenHiX: this.f1(100 - fw / 2 + 5), frozenHiY: this.f1(fTop + 5), frozenHiH: this.f1(Math.max(0, fh - 14)),
      bobAnim: p > 0.08 ? 'tBob 3.4s ease-in-out infinite' : 'none',
      frostOp: (0.8 * (1 - ease(p * 1.4))).toFixed(2),

      dripA: p >= 0.12 && p < 0.98, dripB: p >= 0.45 && p < 0.98,
      puddleRx: this.f1(p < 0.12 ? 0 : 14 + 70 * p), puddleRy: this.f1(p < 0.12 ? 0 : 3 + 3.5 * p),
      puddleHi: this.f1(p < 0.12 ? 0 : 10 + 20 * p),

      isSoak: isSoak, notSoak: !isSoak,
      showFlame: !isSoak && !isCool,
      showBubbles: !isSoak && !isCool && p > 0.05,
      showSteam: !isSoak,
      steamOp: (isCool ? 0.9 * (1 - p) : 0.35 + 0.65 * ease(p * 6)).toFixed(2),
      steamDur: isCool ? '3.4s' : '2.2s',

      bakeIn: this.lerp('#F8EBCB', '#EDBE6E', p * 0.85),
      bakeMid: this.lerp('#F6E6C2', '#E1A04A', p),
      bakeOut: this.lerp('#F2DDB4', '#B9772E', p * 1.1),
      biscuitDot: this.lerp('#E9D3A6', '#A86A25', p),
      puffT: 'translate(100 140) scale(' + puff.toFixed(3) + ') translate(-100 -140)',
      glowOp: (0.75 + 0.25 * ease(p * 4)).toFixed(2),
      showHeat: p > 0.04, heatOp: (0.4 + 0.6 * ease(p * 3)).toFixed(2),

      sandTop: p < 0.99,
      topSandY: this.f1(topY), topDipY: this.f1(topY + 12 * ease(p * 4)),
      botSandY: this.f1(botSandY), botPeakY: this.f1(botPeakY),
      sandFlow: p > 0 && p < 0.99, streamEnd: this.f1(botPeakY)
    };
  }
}
</script>
</body>
</html>
