<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Hết giờ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button:focus-visible{outline:3px solid #FFFFFF;outline-offset:4px}
@keyframes softPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.pulse{animation:softPulse 2.4s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.pulse{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #6E5B55; color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Be Vietnam Pro', system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 88px 28px 64px">

<div aria-hidden="true" style="position: absolute; top: 11px; left: 132px; width: 126px; height: 37px; border-radius: 20px; background: #000000"></div>

<span style="font-size: 17px; font-weight: 600; opacity: 0.9">Mẹ Hẹn Giờ</span>
<span style="margin-top: 4px; font-size: 64px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums">21:48</span>

<div class="pulse" style="margin-top: 56px; width: 176px; height: 176px; border-radius: 50%; background: #FBF6F1; display: flex; align-items: center; justify-content: center; position: relative">
<dc-import name="Icon3d" kind="bell" size="118" hint-size="118px,118px"></dc-import>
<span style="position: absolute; right: 2px; bottom: 6px; width: 64px; height: 64px; border-radius: 50%; background: #F6DCD6; border: 4px solid #FBF6F1; display: flex; align-items: center; justify-content: center">
<dc-import name="Icon3d" kind="pump" size="46" hint-size="46px,46px"></dc-import>
</span>
</div>

<h1 style="margin: 32px 0 0; font-size: 34px; font-weight: 600">Hút sữa xong rồi</h1>

<div style="margin-top: auto; width: 100%; display: flex; align-items: center; justify-content: center; gap: 36px">
<button style="width: 88px; height: 88px; border-radius: 50%; border: none; background: #FBF6F1; color: #4A3F3A; font-size: 17px; font-weight: 600; cursor: pointer">+5 phút</button>
<button style="width: 132px; height: 132px; border-radius: 50%; border: none; background: #F6DCD6; color: #7A3E34; font-size: 26px; font-weight: 600; cursor: pointer">Tắt</button>
</div>
<div aria-hidden="true" style="position: absolute; bottom: 8px; left: 128px; width: 134px; height: 5px; border-radius: 3px; background: #FFFFFF; opacity: 0.85"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
