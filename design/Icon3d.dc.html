<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["all","pump","milk","food","chao","banh","other","bell","check"],"default":"all"},"size":{"editor":"int","default":96,"min":16,"max":240},"$preview":{"width":456,"height":240}}'>
class Component extends DCLogic {
  renderVals() {
    var k = this.props.kind || 'all', n = Number(this.props.size) || 96, all = k === 'all';
    return {
      px: n + 'px',
      rootW: all ? (n * 4 + 72) + 'px' : n + 'px',
      gap: all ? '24px' : '0px',
      showPump: all || k === 'pump', showMilk: all || k === 'milk', showFood: all || k === 'food',
      showChao: all || k === 'chao', showBanh: all || k === 'banh', showOther: all || k === 'other',
      showBell: all || k === 'bell', showCheck: all || k === 'check'
    };
  }
}
</script>
